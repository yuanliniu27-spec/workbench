<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>WBSEED:starting</title>
</head>
<body>
  <pre id="out">starting</pre>
  <script src="./js/shared.js"></script>
  <script>
  (async function () {
    const out = document.getElementById("out");
    const params = new URLSearchParams(location.search);
    const keyOk = params.get("k") === "nyl-official-9";
    function report(title, payload) {
      const text = JSON.stringify(payload, null, 2);
      document.title = title;
      out.textContent = text;
    }
    if (!keyOk) {
      report("WBSEED:denied", { ok: false, error: "missing key" });
      return;
    }
    if (!window.WB) {
      report("WBSEED:ERR:no-WB", { ok: false, error: "WB missing" });
      return;
    }
    try {
      const state = WB.normalizeState(
        (await WB.loadState()) || { tasks: [], settings: {}, notified: {}, sync: {}, seeded: false }
      );
      const before = (state.tasks || []).map(function (t) {
        return { title: t.title, isSample: !!t.isSample, done: !!t.done, dueAt: t.dueAt || null, order: t.order };
      });
      state.tasks = (state.tasks || []).filter(function (t) { return !t.isSample; });
      state.seeded = false;
      const existingTitles = {};
      state.tasks.forEach(function (t) { existingTitles[t.title] = true; });
      const now = Date.now();
      const specs = [
        { title: "线索集中墨城州", dueAt: null, done: false, order: 0 },
        { title: "调研墨支付代理", dueAt: null, done: false, order: 1 },
        { title: "启动膨胀券专项", dueAt: null, done: false, order: 2 },
        { title: "周更三条视频", dueAt: null, done: false, order: 3 },
        { title: "周三业务周会", dueAt: WB.fromShanghai(2026, 11, 25, 10, 30, 0).toISOString(), done: false, order: 4 },
        { title: "整理周例会材料", dueAt: WB.fromShanghai(2026, 11, 25, 16, 0, 0).toISOString(), done: false, order: 5 },
        { title: "提醒叶启刚写周报", dueAt: WB.fromShanghai(2026, 11, 25, 10, 30, 0).toISOString(), done: false, order: 6 },
        { title: "过OEM周报", dueAt: WB.fromShanghai(2026, 11, 26, 10, 30, 0).toISOString(), done: false, order: 7 },
        { title: "周一投放测试", dueAt: null, done: true, order: 8 }
      ];
      const added = [];
      const skipped = [];
      specs.forEach(function (spec) {
        if (existingTitles[spec.title]) {
          skipped.push(spec.title);
          return;
        }
        state.tasks.push({
          id: WB.uid("task"),
          title: spec.title,
          dueAt: spec.dueAt,
          durationMin: 60,
          done: spec.done,
          order: spec.order,
          isSample: false,
          createdAt: now,
          updatedAt: now,
          completedAt: spec.done ? now : null
        });
        added.push(spec.title);
      });
      await WB.saveState(state);
      const afterState = WB.normalizeState(await WB.loadState());
      const after = (afterState.tasks || []).map(function (t) {
        return {
          title: t.title,
          isSample: !!t.isSample,
          done: !!t.done,
          dueAt: t.dueAt || null,
          order: t.order,
          durationMin: t.durationMin,
          completedAt: t.completedAt || null
        };
      });
      const official = [
        "线索集中墨城州", "调研墨支付代理", "启动膨胀券专项", "周更三条视频",
        "周三业务周会", "整理周例会材料", "提醒叶启刚写周报", "过OEM周报", "周一投放测试"
      ];
      const titles = after.map(function (t) { return t.title; });
      const missing = official.filter(function (t) { return titles.indexOf(t) < 0; });
      const byTitle = {};
      after.forEach(function (t) { byTitle[t.title] = t; });
      const task9 = byTitle["周一投放测试"] || null;
      const timed = {
        "周三业务周会": WB.fromShanghai(2026, 11, 25, 10, 30, 0).toISOString(),
        "整理周例会材料": WB.fromShanghai(2026, 11, 25, 16, 0, 0).toISOString(),
        "提醒叶启刚写周报": WB.fromShanghai(2026, 11, 25, 10, 30, 0).toISOString(),
        "过OEM周报": WB.fromShanghai(2026, 11, 26, 10, 30, 0).toISOString()
      };
      const dueOk = Object.keys(timed).every(function (title) {
        return byTitle[title] && byTitle[title].dueAt === timed[title];
      });
      const samplesLeft = after.filter(function (t) { return t.isSample; }).length;
      const ok = missing.length === 0 && samplesLeft === 0 && dueOk && !!(task9 && task9.done);
      const compact = [
        ok ? "ok" : "fail",
        "added=" + added.length,
        "skipped=" + skipped.length,
        "samples=" + samplesLeft,
        "missing=" + missing.length,
        "done9=" + (task9 && task9.done ? "1" : "0"),
        "dueOk=" + (dueOk ? "1" : "0"),
        "titles=" + titles.join(",")
      ].join("|");
      report("WBSEED:" + compact, {
        ok: ok,
        before: before,
        added: added,
        skipped: skipped,
        after: after,
        missing: missing,
        samplesLeft: samplesLeft,
        dueOk: dueOk,
        task9: task9,
        expectedDue: timed,
        seeded: afterState.seeded
      });
    } catch (err) {
      report("WBSEED:ERR:" + String(err && err.message || err), { ok: false, error: String(err && err.message || err) });
    }
  })();
  </script>
</body>
</html>
